<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Trung tâm hỗ trợ - PHÁT VPS</title><link rel="icon" href="logo.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;line-height:1.6}a{text-decoration:none;color:inherit}.container{max-width:1000px;margin:auto;padding:0 20px}header{background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:50}.nav{height:65px;display:flex;align-items:center;justify-content:space-between}.logo,.back,.read{color:#2563eb;font-weight:700}.logo{font-size:21px}.hero{text-align:center;padding:55px 20px 32px}.hero h1{font-size:36px;margin:0 0 8px}.hero p{margin:0;color:#667085}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding-bottom:60px}.card{border:1px solid #e5e7eb;background:#fff;border-radius:14px;overflow:hidden;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:0;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 25px #17203317}.cover{height:210px;background:linear-gradient(145deg,#dbeafe,#eff6ff);display:flex;align-items:center;justify-content:center;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.cover-fallback{font-size:64px}.caption{padding:18px}.caption h2{font-size:19px;margin:0 0 6px}.caption p{font-size:14px;color:#667085;margin:0}.read{display:inline-block;margin-top:11px;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#0f172ab8;z-index:1000;padding:20px;align-items:center;justify-content:center}.modal.show{display:flex}.modal-box{width:min(850px,100%);max-height:92vh;background:#fff;border-radius:16px;overflow:hidden}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:17px 22px;border-bottom:1px solid #e5e7eb}.modal-head h2{font-size:22px;margin:0}.close{border:0;background:#eef2f7;border-radius:50%;width:38px;height:38px;font-size:24px;cursor:pointer}.modal-body{padding:22px;max-height:calc(92vh - 73px);overflow:auto}.intro{color:#667085;margin:0 0 20px}.figure{margin:0 0 26px}.figure img{display:block;width:100%;max-height:570px;object-fit:contain;background:#eef2f7;border-radius:10px}.figure figcaption{text-align:center;color:#475467;font-size:14px;margin-top:9px}.steps{padding-left:23px}.steps li{margin:8px 0}.empty{background:#eff6ff;color:#2563eb;padding:18px;border-radius:10px;text-align:center}body.lock{overflow:hidden}footer{text-align:center;padding:25px;color:#98a2b3;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}.cover{height:185px}.modal{padding:10px}.modal-body{padding:17px}}
</style></head><body>
<header><div class="container nav"><a class="logo" href="index.html">PHÁT VPS</a><a class="back" href="index.html">← Quay lại trang chủ</a></div></header>
<main><div class="hero"><h1>Trung tâm hỗ trợ</h1><p>Chọn hình ảnh hoặc mô tả giống lỗi bạn đang gặp</p></div><div class="container grid" id="articleGrid"></div></main>
<div class="modal" id="modal" onclick="backdrop(event)"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" onclick="closeArticle()">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
<footer>© 2026 PHÁT VPS. All rights reserved.</footer>
<script src="support-data.js"></script><script>
const data=window.SUPPORT_ARTICLES||[],grid=document.getElementById('articleGrid');
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
grid.innerHTML=data.map((a,i)=>`<button class="card" onclick="openArticle(${i})"><div class="cover">${a.images&&a.images[0]?`<img src="${a.images[0].src}" alt="${esc(a.title)}">`:`<div class="cover-fallback">🛠️</div>`}</div><div class="caption"><h2>${esc(a.title)}</h2><p>${esc(a.summary)}</p><span class="read">Xem bài viết →</span></div></button>`).join('');
function openArticle(i){const a=data[i];document.getElementById('modalTitle').textContent=a.title;const pics=(a.images||[]).map(x=>`<figure class="figure"><img src="${x.src}" alt="${esc(x.caption||a.title)}"><figcaption>${esc(x.caption)}</figcaption></figure>`).join('');const steps=(a.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('');document.getElementById('modalBody').innerHTML=`<p class="intro">${esc(a.summary)}</p>${pics||'<div class="empty">Bài viết này chưa có ảnh hướng dẫn.</div>'}${steps?`<ol class="steps">${steps}</ol>`:''}`;document.getElementById('modal').classList.add('show');document.body.classList.add('lock')}
function closeArticle(){document.getElementById('modal').classList.remove('show');document.body.classList.remove('lock')}function backdrop(e){if(e.target.id==='modal')closeArticle()}addEventListener('keydown',e=>{if(e.key==='Escape')closeArticle()});
</script></body></html>
